<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <section class="container">

        <div class="flip-card">

            <div class="card-inner">

                <!-- Front -->
                <div class="card-front">

                    <img src="images/building.jfif" alt="Building">

                    <div class="front-content">

                        <h2>
                            Financial Sector
                            Development
                            Program
                        </h2>

                        <button>&#8594;</button>

                    </div>

                </div>

                <!-- Back -->

                <div class="card-back">

                    <img src="images/logo.png" class="logo" alt="Logo">

                    <h2>
                        Financial Sector
                        Development
                        Program
                    </h2>

                    <p>
                        The Program aims to develop a diversified
                        and effective financial sector to support
                        the development of Saudi Arabia's economy.
                    </p>

                    <a href="#">Read More</a>

                </div>

            </div>

        </div>

    </section>

</body>
</html>
